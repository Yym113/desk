<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小玉的工作台</title>
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface2:#F9FAF8;
  --ink:#232B28; --ink2:#65716C; --ink3:#9AA6A0;
  --line:#E4EAE5; --brand:#2E6B58; --brand2:#3E8C6F;
  --soft:#E7F1EB; --green:#3E7C5A; --red:#C05046;
  --shadow:0 2px 6px rgba(35,55,45,.04),0 10px 28px rgba(35,55,45,.05);
  --brand-dark:#245546; --soft2:#CDE2D4; --ring:rgba(46,107,88,.09);
}
body.dark{
  --bg:#191C1B; --surface:#222725; --surface2:#1D2220;
  --ink:#E8EDEA; --ink2:#A6B2AD; --ink3:#78847F;
  --line:#313835;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
.app{display:flex;min-height:100vh}

/* 侧栏 */
.side{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:26px 16px 18px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 24px;cursor:pointer;border-radius:10px;transition:.15s}
.brand:hover{background:var(--surface2)}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:13px;background:linear-gradient(140deg,var(--brand2),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.12);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.emoji{font-size:21px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--soft2)}
.brand b{display:block;font-size:15px;letter-spacing:.3px}
.brand small{display:block;color:var(--ink3);font-size:11px;margin-top:1px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink2);font-size:13.5px;text-align:left;transition:.15s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--soft);color:var(--brand);font-weight:600}
.nav .ico{width:20px;text-align:center;font-size:15px}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.side-foot .lbl{font-size:11px;color:var(--ink3);padding:0 10px 8px;letter-spacing:.5px}
.side-foot .row{display:flex;gap:6px;padding:0 6px}
.side-foot button{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:11.5px;color:var(--ink2);background:var(--surface)}
.side-foot button:hover{border-color:var(--brand);color:var(--brand)}
.copy{font-size:10.5px;color:var(--ink3);text-align:center;padding-top:12px}
.langsel2{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  font:inherit;font-size:12.5px;color:var(--ink);padding:8px 10px;cursor:pointer;outline:none}
.langsel2:hover{border-color:var(--brand);color:var(--brand)}
.langpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px}
.langpick .lbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface2);color:var(--ink);cursor:pointer;transition:.18s}
.langpick .lbtn b{font-size:14px;font-weight:600}
.langpick .lbtn small{font-size:11px;color:var(--ink3)}
.langpick .lbtn:hover{border-color:var(--brand);color:var(--brand)}
.langpick .lbtn.on{border-color:var(--brand);background:var(--soft);color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.langpick .lbtn.on small{color:var(--brand)}
/* 头像设置 */
.avrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}
.avbig .avatar{box-shadow:0 6px 18px rgba(0,0,0,.13)}
.avact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.avitem{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);
  font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;padding:0}
.avitem:hover{border-color:var(--brand);transform:translateY(-1px)}
.avitem.on{border-color:var(--brand);background:var(--soft);box-shadow:0 0 0 3px var(--ring)}

/* 主区 */
.main{flex:1;min-width:0;padding:26px 36px 70px;max-width:1240px;margin:0 auto;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.hello h1{font-size:23px;font-weight:650;letter-spacing:.5px}
.hello p{color:var(--ink2);font-size:12.5px;margin-top:3px}
.cd{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow)}
.cd .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(0,0,0,.06);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,80,70,0)}}
.cd small{display:block;color:var(--ink3);font-size:10.5px;line-height:1.3}
.cd b{font-size:15px;font-variant-numeric:tabular-nums;color:var(--red);letter-spacing:.5px}
.cd.done b{color:var(--ink3)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.15fr .85fr}
.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.card h2{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card h2 .tag{margin-left:auto}
.sub{color:var(--ink3);font-size:11.5px;margin-bottom:16px}
.tag{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.tag.hot{background:var(--soft);color:var(--brand);border-color:var(--soft2)}
.tag.g{background:var(--soft);color:var(--green);border-color:var(--soft2)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;border-radius:9px;padding:8px 15px;font-size:12.5px;font-weight:500;transition:.15s}
.btn:hover{background:var(--brand-dark)}
.btn.ghost{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft);color:var(--brand);border-color:var(--soft2)}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:7px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #F0D4D0}
.btn.danger:hover{background:#FCEDEA}
.inp,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 11px;outline:none;transition:.15s;font-size:13px}
.inp:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--ring)}
textarea{resize:vertical;line-height:1.75}
label.f{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:5px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-row>div{flex:1;min-width:120px}
.form-row>div.w{flex:2.2}
.muted{color:var(--ink3);font-size:11.5px}
.empty{color:var(--ink3);font-size:12.5px;text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:11px;background:var(--surface2)}

/* 勾选清单 */
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk input{appearance:none;width:17px;height:17px;flex:0 0 17px;border:1.6px solid #D2DCD5;border-radius:5px;margin-top:2px;position:relative;background:#fff;cursor:pointer;transition:.15s}
.chk input:checked{background:var(--green);border-color:var(--green)}
.chk input:checked::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.chk .txt{flex:1;font-size:13px}
.chk .txt small{display:block;color:var(--ink3);font-size:11px;margin-top:1px}
.chk input:checked+.txt{text-decoration:line-through;color:var(--ink3)}
.chk .del{color:var(--ink3);font-size:15px;line-height:1;padding:2px 5px;border-radius:6px;opacity:0}
.chk:hover .del{opacity:1}
.chk .del:hover{color:var(--red);background:#FCEDEA}

/* 进度环 */
.hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{width:104px;height:104px;flex:0 0 104px;border-radius:50%;background:conic-gradient(var(--brand) var(--p),var(--line) 0);display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;background:var(--surface);border-radius:50%}
.ring b{position:relative;font-size:22px;font-weight:650;color:var(--brand)}
.hero-info{flex:1;min-width:220px}
.hero-info h3{font-size:17px;margin-bottom:4px}
.hero-info p{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
.bar{height:7px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}

/* 日程 / 任务 */
.daygrp{margin-top:16px}
.daygrp h4{font-size:11.5px;color:var(--brand);letter-spacing:.5px;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.daygrp h4::after{content:"";flex:1;height:1px;background:var(--line)}
.daygrp.today h4{color:var(--ink);font-size:12.5px;font-weight:700}
.daygrp.today h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red,#C0531A)}
.evt,.task{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--surface2)}
.evt .tm{font-size:12px;color:var(--brand);font-weight:600;font-variant-numeric:tabular-nums;min-width:44px}
.evt .ti,.task .ti{flex:1;font-size:13px}
.evt .cat,.task .cat{font-size:10.5px;padding:1px 8px;border-radius:20px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.evt.done .ti,.task.done .ti{text-decoration:line-through;color:var(--ink3)}
.evt.urgent{border-color:#EFCBC6;background:#FDF3F2}
.evt .x,.task .x{color:var(--ink3);font-size:16px;padding:0 4px;line-height:1}
.evt .x:hover,.task .x:hover{color:var(--red)}
.evt input[type=checkbox],.task input[type=checkbox]{accent-color:var(--green);width:15px;height:15px;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink2);border-radius:20px;padding:4px 13px;font-size:11.5px}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--soft);color:var(--brand);border-color:var(--soft2);font-weight:600}

/* 常用网站 */
.qlinks{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.qlink{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface2);transition:.15s}
.qlink:hover{border-color:var(--brand);background:var(--soft);transform:translateX(2px)}
.qico,.site-ico{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--brand)}
.qlink .nm{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlink .arrow{color:var(--ink3);font-size:13px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.site{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.site .top{display:flex;align-items:center;justify-content:flex-start;flex-wrap:nowrap;gap:10px;margin:0}
.site .top>div{flex:1;min-width:0}
.site-ico{width:34px;height:34px;flex:0 0 34px;font-size:15px}
.site .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .ur{font-size:10.5px;color:var(--ink3);word-break:break-all;line-height:1.4}
.site .nt{font-size:11.5px;color:var(--ink2);min-height:18px}
.site .ops{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.site .ops a{flex:1;text-align:center;background:var(--brand);color:#fff;border-radius:8px;padding:6px 10px;font-size:11.5px}
.site .ops a:hover{background:var(--brand-dark)}
.site .ops button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:11px;color:var(--ink2)}
.site .ops button:hover{color:var(--brand);border-color:var(--brand)}
.site .ops button.rm:hover{color:var(--red);border-color:#EFCCC7}

/* 优先级 */
.pri{font-size:10.5px;font-weight:600;border-radius:20px;padding:1px 8px;white-space:nowrap;border:1px solid transparent}
.pri.p0{background:#FCEBE9;color:#C4453A;border-color:#F3D3CF}
.pri.p1{background:#FDF2E3;color:#B9701A;border-color:#F0DFC4}
.pri.p2{background:var(--soft);color:var(--brand);border-color:var(--soft2)}
.pri.p3{background:#F0F2F4;color:#7A8792;border-color:#E2E7EB}
body.dark .pri.p0{background:#3A2523;border-color:#54322D}
body.dark .pri.p1{background:#3A3020;border-color:#54452C}
body.dark .pri.p3{background:#2A302E;border-color:#39413E}
.minisel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 6px;font-size:11px;color:var(--ink2);cursor:pointer;max-width:92px}
.minisel:hover{border-color:var(--brand)}
.task.overdue{border-color:#EFCBC6;background:#FDF3F2}
body.dark .task.overdue{background:#332524}

/* 最该先做 */
.ulist{display:flex;flex-direction:column;gap:7px}
.uitem{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);cursor:pointer;transition:.15s;flex-wrap:wrap}
.uitem:hover{border-color:var(--brand);background:var(--soft);transform:translateX(2px)}
.uleft{display:flex;align-items:center;gap:9px;flex:1;min-width:160px}
.ut{font-size:13.5px;font-weight:500}
.uleft2{font-size:11.5px;color:var(--ink2);white-space:nowrap}
.uleft2.over{color:#C4453A;font-weight:600}

/* 记账 */
.billsum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
/* 视图切换（月/年） */
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg-b{border:none;background:none;padding:6px 18px;border-radius:8px;font-size:13px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s}
.seg-b:hover{color:var(--brand)}
.seg-b.on{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
/* 时间切换 */
.timenav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tn-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;font-size:17px;line-height:1;color:var(--ink2);cursor:pointer;transition:.15s}
.tn-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--soft)}
.tn-cur{display:flex;align-items:center;gap:10px;padding:5px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.tn-pick{border:none;background:none;font:600 15px/1.4 inherit;color:var(--ink);cursor:pointer;outline:none;padding:0;min-width:118px}
.tn-pick::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55}
.tn-sub{font-size:11.5px;color:var(--ink3);white-space:nowrap;border-left:1px solid var(--line);padding-left:10px}
/* 年度柱状 */
.ybar{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:150px}
.ybar-col{display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:none;cursor:pointer;padding:0;height:100%;justify-content:flex-end;font-family:inherit}
.ybar-col:hover .ybars i{filter:brightness(1.12)}
.ybars{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.ybars i{display:block;width:8px;border-radius:3px 3px 0 0;min-height:2px;transition:.2s}
.ybars .bo{background:#D8806E}
.ybars .bi{background:var(--brand2)}
.ybar-col .ym{font-size:10.5px;color:var(--ink3)}
.barlegend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:10px;align-items:center;flex-wrap:wrap}
.barlegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.barlegend .bo{background:#D8806E}
.barlegend .bi{background:var(--brand2)}
.billmeta{font-size:11.5px;color:var(--ink3);margin-top:10px}
/* 每月明细表 */
.mtab{display:flex;flex-direction:column;margin-top:12px;font-size:12.5px}
.mtab-h,.mtab-r{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:8px 12px;text-align:right;align-items:center}
.mtab-h{color:var(--ink3);font-size:11px;border-bottom:1px solid var(--line);padding-bottom:7px}
.mtab-h span:first-child,.mtab-r span:first-child{text-align:left}
.mtab-r{border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;color:var(--ink);font-variant-numeric:tabular-nums;transition:.12s}
.mtab-r:hover{background:var(--soft)}
.mtab-r.empty{color:var(--ink3)}
.mtab-r .out{color:#C4453A}
.mtab-r .in{color:var(--brand)}
body.dark .mtab-r .out{color:#E08A7E}
/* 打印账单时只留内容 */
@media print{
  .side,.nav,.top,.impbox,.seg,.timenav,.toast,#toast{display:none!important}
  body{background:#fff}
  .main{padding:0}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}
  .x,button{display:none!important}
}
.billsum>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface2)}
.billsum small{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
.billsum b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.billsum .out{color:#C4453A}
.billsum .in{color:var(--brand)}
body.dark .billsum .out{color:#E08A7E}
.catbars{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.cbar{display:flex;align-items:center;gap:10px;font-size:12px}
.cbar .cn{width:52px;color:var(--ink2);flex:0 0 52px}
.cbar-bg{flex:1;height:9px;border-radius:8px;background:var(--line);overflow:hidden}
.cbar-bg i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.cbar .cv{width:112px;text-align:right;color:var(--ink3);flex:0 0 112px;font-variant-numeric:tabular-nums}
.bills{display:flex;flex-direction:column;gap:1px;margin-top:8px}
.bill{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:12.5px}
.bill:last-child{border-bottom:none}
.bill .bd{color:var(--ink3);width:46px;flex:0 0 46px;font-variant-numeric:tabular-nums}
.bill .bc{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--ink2);flex:0 0 auto}
.bill .bn{flex:1;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill .ba{font-variant-numeric:tabular-nums;font-size:13.5px}
.bill .ba.out{color:#C4453A}
.bill .ba.in{color:var(--brand)}
.bill .x{color:var(--ink3);font-size:15px;padding:0 5px;opacity:0}
.bill:hover .x{opacity:1}
.bill .x:hover{color:#C4453A}

/* 内嵌导入框 */
.impbox{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
.imp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.imp-head b{font-weight:600;color:var(--ink)}
.imp-head .btn{margin-left:auto}
.imp-body{margin-top:11px}
.imp-drop{border:1.5px dashed var(--line);border-radius:11px;padding:10px;transition:.15s;background:var(--surface2)}
.imp-drop.dragover{border-color:var(--brand);background:var(--soft)}
.imp-drop textarea{border:none;background:#fff}
body.dark .imp-drop textarea{background:var(--surface)}
.imp-imgrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.imp-prev{position:relative;margin-top:9px;display:inline-block}
.imp-prev img{max-height:150px;max-width:100%;border-radius:9px;border:1px solid var(--line);display:block}
.imp-prev .x{position:absolute;top:-7px;right:-7px;background:var(--ink);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.imp-res{margin-top:12px;border:1px solid var(--soft2);background:var(--soft);border-radius:11px;padding:11px}
.imp-res-h{font-size:12px;font-weight:600;color:var(--brand);margin-bottom:9px}
.imp-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;align-items:center}
.imp-row .inp{flex:0 0 auto;width:auto;background:#fff}
.imp-row input[type=date]{flex:0 0 132px}
.imp-row input[type=time]{flex:0 0 92px}
body.dark .imp-row .inp{background:var(--surface)}

/* 主题 & 账户 */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:4px}
.sw{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface2);display:flex;align-items:center;gap:5px;flex-wrap:wrap;transition:.15s}
.sw:hover{border-color:var(--brand);transform:translateY(-1px)}
.sw.on{border-color:var(--brand);background:var(--soft);box-shadow:0 0 0 2px var(--soft2)}
.sw i{width:16px;height:16px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.06)}
.sw span{width:100%;font-size:12px;color:var(--ink2);margin-top:3px;font-weight:500}
.sw.on span{color:var(--brand);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle span{width:38px;height:21px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:0 0 38px}
.toggle span::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span::after{left:19px}
.accs{display:flex;flex-wrap:wrap;gap:9px}
.acc{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:11px;padding:8px 14px 8px 9px;background:var(--surface2);font-size:13px;color:var(--ink2)}
.acc:hover{border-color:var(--brand)}
.acc.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:600}
.acc .av{width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.acc small{font-size:10px;background:var(--brand);color:#fff;border-radius:20px;padding:1px 7px}
body.dark .sw i{border-color:rgba(255,255,255,.12)}
body.dark .toggle span{background:#3A423F}
body.dark .toggle span::after{background:#E8EDEA}

/* 命名生成器 / 其它 */
.namebox{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:12px}
.nameline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;flex-wrap:wrap}
.nameline:last-child{border-bottom:none}
.nameline code{flex:1;min-width:200px;font-family:Consolas,"Courier New",monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--brand);word-break:break-all;font-size:12px}
.note{background:var(--soft);border:1px solid var(--soft2);border-radius:9px;padding:10px 12px;font-size:11.5px;color:var(--ink2);margin-top:10px;line-height:1.6}
.hwlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hwlist button{border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-size:12.5px;color:var(--ink2);background:var(--surface2)}
.hwlist button.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:600}
.hwlist button:hover{border-color:var(--brand)}
.kv{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:10px 0 14px}
.kv b{color:var(--ink);font-weight:600}
#toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 26px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateY(0)}
@media(max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:static;padding:14px 16px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding-bottom:12px}.nav{flex-direction:row;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;width:auto;padding:8px 12px}
  .nav .badge{display:none}
  .side-foot{margin-top:12px;padding-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .side-foot .lbl,.side-foot .copy{display:none}
  .side-foot .row{padding:0;flex:1 1 240px}
  .langsel2{margin-top:0;flex:0 0 auto;width:auto;min-width:150px}
  .main{padding:20px 16px 60px}.g2,.g2e{grid-template-columns:1fr}
}
</style>
</head>

function themeKeys(){return Object.keys(THEMES)}
function applyTheme(profile){
  const th=(profile.theme==='custom'&&profile.colors)?profile.colors:(THEMES[profile.theme]||THEMES.green), r=document.documentElement.style;
  r.setProperty('--brand',th.brand);r.setProperty('--brand2',th.brand2);r.setProperty('--soft',th.soft);
  r.setProperty('--soft2',th.soft2);r.setProperty('--brand-dark',th.dark);r.setProperty('--ring',th.ring);
  r.setProperty('--green',th.brand);
  document.body.classList.toggle('dark',!!profile.dark);
}
function rawProf(){
  try{const r=JSON.parse(localStorage.getItem(PKEY)||'null');if(r)return r}catch(e){}
  return null;
}
function prof(){
  const r=rawProf()||{};
  const themes=(r.themes&&typeof r.themes==='object')?JSON.parse(JSON.stringify(r.themes)):{};
  const user=r.user||null;
  const mine=themes[user||'_guest']||{};
  return {user,theme:mine.theme||'green',dark:!!mine.dark,themes,colors:mine.colors||null,lang:mine.lang||'zh',avatar:mine.avatar||null};
}
function saveProf(p){
  const cur=rawProf()||{};
  const themes=(cur.themes&&typeof cur.themes==='object')?JSON.parse(JSON.stringify(cur.themes)):{};
  const u=p.user||'_guest';
  themes[u]={theme:p.theme||'green',dark:!!p.dark,colors:p.colors||null,lang:p.lang||'zh',avatar:p.avatar||null};
  const out={user:p.user||null,themes};
  try{localStorage.setItem(PKEY,JSON.stringify(out))}catch(e){}
}
function accounts(){try{return JSON.parse(localStorage.getItem(AKEY)||'[]')}catch(e){return []}}

function copy(text){
  const done=()=>toast('已复制，可以直接粘贴了');
  const fb=()=>{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('复制失败，请手动选中文字')}document.body.removeChild(a)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(done).catch(fb);else fb();
}
function normUrl(u){
  u=String(u||'').trim();if(!u)return '';
  if(!/^https?:\/\//i.test(u))u='https://'+u;

/* 所有中文源词条，按长度倒序（长串优先，避免「支出」先吃掉「全年支出」） */
const ZH_KEYS=[...new Set(Object.values(I18N).flatMap(o=>Object.keys(o)))].sort((a,b)=>b.length-a.length);
function curLang(){return (P&&P.lang)||'zh'}
/* 取词：t('中文') → 当前语言译文；无译文回退中文 */
function t(k){
  const L=curLang();
  if(L==='zh')return k;
  const d=I18N[L];if(!d)return k;
  return d[k]!=null?d[k]:k;
}
/* 整段兜底翻译：把渲染结果里出现的已知词条替换掉（长串优先，词条数少的语言回退到英文再回退中文） */
function localizeHtml(html){
  const L=curLang();
  if(L==='zh')return html;
  const d=I18N[L];if(!d)return html;
  const hit=k=>(d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:null));
  /* 只看标签外面的纯文本，属性里的 placeholder / title 一律不碰 */
  const out=[];
  const re=/<[^>]*>/g;
  let last=0,m;
  while((m=re.exec(html))){
    out.push(tr(html.slice(last,m.index)));   // 标签之间的文本
    out.push(m[0]);                            // 标签原样保留
    last=m.index+m[0].length;
  }
  out.push(tr(html.slice(last)));
  return out.join('');
  function tr(seg){
    if(!seg||!/[\u4e00-\u9fa5]/.test(seg))return seg;
    const lead=(seg.match(/^\s*/)||[''])[0], trail=(seg.match(/\s*$/)||[''])[0];
    const core=seg.slice(lead.length,seg.length-trail.length);
    if(!core)return seg;
    /* ① 整段直接命中 */
    let v=hit(core);
    if(v!=null)return lead+v+trail;
    /* ② 含数字的长句（日期、金额）：只替换里面明确登记过的长词条 */
    if(/\d/.test(core)){
      let o=core;
      ZH_KEYS.forEach(k=>{if(k.length<4||o.indexOf(k)<0)return;const vv=hit(k);if(vv!=null)o=o.split(k).join(vv)});
      return lead+o+trail;
    }
    /* ③ 带分隔符的拼串（「课程·活动」「明天 · 1」）：按分隔符切开，每段单独翻，可译的译、译不了的原样 */
    const gs=core.split(/(\s*[·•|｜]\s*)/);
    if(gs.length>1){
      const gd=gs.map((p,idx)=>{
        if(idx%2)return p;
        const k=p.trim();
        if(!k)return p;
        const vv=hit(k);
        return vv!=null?p.replace(k,vv):p;
      });
      if(gd.some((p,idx)=>idx%2===0&&p!==gs[idx]))return lead+gd.join('')+trail;
    }
    /* ④ 纯中文长句：整句不行就按中文标点切子句，子句能全翻就翻 */
    const parts=core.split(/(?<=[，。；！？、：])/);
    if(parts.length>1){
      const done=parts.map(p=>{const k=p.trim();const vv=hit(k);return vv!=null?p.replace(k,vv):null});
      if(done.every(Boolean))return lead+done.join('')+trail;
    }
    /* ⑤ 兜底：逐词条替换短片段 */
    let o=core;
    ZH_KEYS.forEach(k=>{if(k.length<2||o.indexOf(k)<0)return;const vv=hit(k);if(vv!=null)o=o.split(k).join(vv)});
    return lead+o+trail;
  }
}

function tt(k){
  const L=curLang();
  if(L==='zh')return k;

}

/* 统一成"到期时间戳"，用于排序：日程取日期+时间，任务取 due，作业取 deadline */
function dueOf(x){
  if(x.deadline)return new Date(x.deadline).getTime();
  if(x.date)return new Date(x.date+(x.time?('T'+x.time):'T23:59')).getTime();
  if(x.due)return new Date(x.due.length<=10?x.due+'T23:59':x.due).getTime();
  return Infinity;
}
/* 综合分：重要程度优先，其次离到期越近越前；没有期限的排后面 */
function scoreOf(x){
  const d=dueOf(x),now=Date.now();
  let s=priOf(x.pri).rank*100;
  if(d!==Infinity){
    const days=(d-now)/86400000;
    if(days<0)s-=50;                 // 已过期，最该看见
    else if(days<1)s-=20;
    else if(days<3)s-=10;
    else if(days<7)s-=4;
    s+=Math.min(days,999)*0.02;      // 同优先级里，越近越前
  }else s+=20;                       // 没期限的往后放
  return s;
}
function sortByUrgent(list){return [...list].sort((a,b)=>scoreOf(a)-scoreOf(b))}
/* 把作业、日程、任务合成一张"今天该先做什么"的表 */

  S.tasks.forEach(t=>{if(!t.done)out.push({...t,kind:'任务',label:t.t,sub:t.cat,to:'task'})});
  return sortByUrgent(out);
}
function leftText(x){
  const d=dueOf(x);if(d===Infinity)return '没有期限';
  const now=Date.now(),diff=d-now;
  if(diff<0){
    // 按「自然日」算，避免今天到期被算成已过期
    const dayDiff=Math.round((startOfDay(new Date(d))-startOfDay(new Date(now)))/86400000);
    if(dayDiff>=0)return t('今天到期');
    return t('已过期 ')+Math.abs(dayDiff)+t(' 天');
  }
  const dayDiff=Math.floor((startOfDay(new Date(d))-startOfDay(new Date(now)))/86400000);
  if(dayDiff===0){const hh=Math.max(1,Math.ceil(diff/3600000));return t('今天还剩')+hh+t(' 小时')}
  return t('还剩')+dayDiff+t(' 天');
}
function startOfDay(dt){const t=new Date(dt);t.setHours(0,0,0,0);return t.getTime()}

function tick(){
  /* 全表扫描：未完成的作业 / 日程 / 任务，谁离现在最近就算谁；已过的跳过 */
  const now=Date.now();
  const cand=[];
  S.hws.forEach(h=>{if(pct(h)>=100)return;const d=new Date(h.deadline).getTime();if(!isNaN(d))cand.push({d,t:h.title,k:'作业'})});
  S.events.forEach(e=>{if(e.done)return;const d=dueOf(e);if(d!==Infinity&&!isNaN(d))cand.push({d,t:e.title,k:'日程'})});
  S.tasks.forEach(x=>{if(x.done)return;const d=dueOf(x);if(d!==Infinity&&!isNaN(d))cand.push({d,t:x.t,k:'任务'})});
  cand.sort((a,b)=>a.d-b.d);
  const next=cand.find(x=>x.d>now);   /* 过期的不显示，跳到下一个 */
  const el=document.getElementById('cdText'),box=document.getElementById('cdBox');
  const lbl=box.querySelector('small');
  if(!next){
    lbl.textContent=t('最近没有到期的事');
    el.textContent='—';
    box.classList.add('done');
    return;
  }
  box.classList.remove('done');
  lbl.textContent=t('距')+'「'+next.t+'」·'+t(next.k);
  const tms=next.d-now;
  const dd=Math.floor(tms/86400000),hh=Math.floor(tms%86400000/3600000),mm=Math.floor(tms%3600000/60000),ss=Math.floor(tms%60000/1000);
  el.textContent=(dd?dd+'天 ':'')+pad(hh)+':'+pad(mm)+':'+pad(ss);
}
setInterval(tick,1000);

/* ============ 粘贴解析 ============ */
function parseDate(s){
  let y,m,mo,d;
  const today=new Date();
  if(/(今天|今日)/.test(s))return ymd(today);
  if(/(明天|明日)/.test(s)){const t=new Date(today.getTime()+86400000);return ymd(t)}
  if(/(后天)/.test(s)){const t=new Date(today.getTime()+2*86400000);return ymd(t)}
  // 「周三 / 下周三 / 星期五」→ 最近的将来那一天
  if(m=s.match(/(这|本|下)?\s*(?:周|星期|礼拜)\s*([一二三四五六日天])/)){
    const map={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0};
    const target=map[m[2]],cur=today.getDay();
    let add=(target-cur+7)%7;
    if(m[1]==='下')add=add===0?7:add+7;
    else if(add===0)add=7;            // 「周三」当天说，按下一个周三算
    const d2=new Date(today.getTime()+add*86400000);
    return ymd(d2);
  }
  if(m=s.match(/(20\d{2})\s*[-\/.年]\s*(\d{1,2})\s*[-\/.月]\s*(\d{1,2})/)){y=+m[1];mo=+m[2];d=+m[3]}
  else if(m=s.match(/(\d{1,2})\s*月\s*(\d{1,2})/)){y=today.getFullYear();mo=+m[1];d=+m[2]}
  else if(m=s.match(/(?:^|[^\d:：])(\d{1,2})\s*[-\/.]\s*(\d{1,2})(?![\d:：])/)){y=today.getFullYear();mo=+m[1];d=+m[2]}
  else if(m=s.match(/(\d{1,2})\s*[号日]/)){y=today.getFullYear();mo=today.getMonth()+1;d=+m[1]}
  else return null;
  if(mo<1||mo>12||d<1||d>31)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
const CN={'零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function cnNum(s){
  s=String(s||'').trim();
  if(!s)return null;
  if(/^\d+$/.test(s))return +s;
  if(s==='十')return 10;
  if(/^十[一二三四五六七八九]$/.test(s))return 10+CN[s[1]];
  if(/^[一二三四五六七八九]十$/.test(s))return CN[s[0]]*10;
  if(/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(s))return CN[s[0]]*10+CN[s[2]];
  if(/^[零一二两三四五六七八九]$/.test(s))return CN[s];
  return null;
}
function parseTime(s){
  let m=s.match(/(上午|下午|中午|晚上|傍晚|凌晨|早上|早晨)?\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
  if(m&&+m[2]<24)return fixHour(+m[2],m[1])+':'+m[3];
  m=s.match(/(上午|下午|中午|晚上|傍晚|凌晨|早上|早晨)?\s*(\d{1,2}|[零一二两三四五六七八九十]{1,3})\s*[点時时]\s*(半|\d{1,2}|[零一二三四五六七八九十]{1,3})?/);
  if(m){
    let hh=cnNum(m[2]);if(hh==null||hh>24)return null;
    let mm=0;if(m[3]==='半')mm=30;else if(m[3]){const v=cnNum(m[3]);if(v!=null)mm=v}
    return fixHour(hh,m[1])+':'+pad(Math.min(mm,59));
  }
  return null;
}
function fixHour(hh,pre){
  if(!pre)return pad(hh);
  if(/下午|晚上|傍晚/.test(pre)&&hh<12)hh+=12;
  if(pre==='中午'&&hh<11)hh+=12;
  if(pre==='凌晨'&&hh===12)hh=0;
  if(hh>=24)hh=hh%24;
  return pad(hh);
}
function parseText(txt,mode){
  const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  lines.forEach(L=>{
    if(/^[-*·•\d.、)）]+\s*/.test(L)&&L.replace(/[\s|,，、-]/g,'').length<3)return;
    const body=L.replace(/^[-*·•]+\s*/,'').replace(/^\d+[.、)）]\s*/,'').trim();
    if(!body)return;
    const date=parseDate(body)||mode.fallbackDate||'';
    const time=parseTime(body)||'';
    // 「重要 / 急 / 一般 / 不着急」这类词顺手变成优先级
    let pri='';
    if(/(十万火急|非常急|特别急|马上|立刻|紧急|火烧眉毛)/.test(body))pri='p0';
    else if(/(重要|要紧|关键|必须)/.test(body))pri='p1';
    else if(/(不急|随时|有空|看情况)/.test(body))pri='p3';
    else pri='p2';
    let title=body;
    title=title.replace(/(今天|今日|明天|明日|后天)/g,'');
    title=title.replace(/(这|本|下)?\s*(?:周|星期|礼拜)\s*[一二三四五六日天]\s*(前|之前|截止)?/g,'');
    title=title.replace(/（\s*）/g,'').replace(/\(\s*\)/g,'').replace(/【\s*】/g,'');
    title=title.replace(/(十万火急|非常急|特别急|火烧眉毛|紧急|重要|要紧|关键|不急|随时)/g,'');
    title=title.replace(/\d{1,2}\s*[:：]\s*\d{2}\s*[-–—~至到]\s*\d{1,2}\s*[:：]\s*\d{2}/g,'');
    title=title.replace(/(上午|下午|中午|晚上|傍晚|凌晨|早上|早晨)?\s*\d{1,2}\s*[:：]\s*\d{2}/g,'');
    title=title.replace(/20\d{2}\s*[-\/.年]\s*\d{1,2}\s*[-\/.月]\s*\d{1,2}\s*[日号]?/g,'');
    title=title.replace(/\d{1,2}\s*[-\/.]\s*\d{1,2}(?!\d|:)/g,'');
    title=title.replace(/\d{1,2}\s*月\s*\d{1,2}\s*[日号]?/g,'');
    title=title.replace(/\d{1,2}\s*[号日](?![0-9:：])/g,'');
    title=title.replace(/(上午|下午|中午|晚上|傍晚|凌晨|早上|早晨)?\s*(\d{1,2}|[零一二两三四五六七八九十]{1,3})\s*[点時时]\s*(半|\d{1,2}|[零一二三四五六七八九十]{1,3})?\s*(前|之前)?/g,'');
    title=title.replace(/(截止日期|截止时间|截止|deadline)\s*[:：]?/gi,'');
    title=title.replace(/^\s*(前|之前|截止)\s*/,'').replace(/\s{2,}/g,' ').trim();
    title=title.replace(/\s{2,}/g,' ');
    title=title.replace(/^[\s,，、:：|\-—~至到]+|[\s,，、:：|\-—~至到]+$/g,'');
    title=title.replace(/（\s*）/g,'').replace(/\(\s*\)/g,'').replace(/【\s*】/g,'').trim();
    if(!title)title=body.replace(/（\s*）/g,'').replace(/\(\s*\)/g,'').trim();
    out.push({date,time,title:title||body,cat:'其他',pri});
  });
  return out;
}

const AI_PROVIDERS=[
 {k:'qwen',n:'通义千问 qwen-vl',model:'qwen-vl-max',ep:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',

];
function aiCfg(){return S.aiProf||{}}
function aiReady(){const c=aiCfg();return !!(c.key&&String(c.key).trim())}
const OCR_PROMPT='请把这张图片里的文字和条目完整识别出来，用于整理成日程或待办。要求：\n1. 一行一条，不要表格、不要编号以外的解释；\n2. 每条尽量带上日期和时间（如 2026-11-15 18:30），没有就只写内容；\n3. 原文是什么字就写什么字，不要改写、不要总结；\n4. 如果图里是作业要求，把要求原文也逐行输出。\n只输出识别结果，不要任何开场白。';
async function aiRecognize(dataUrl){
  const c=aiCfg();
  if(!c.key)throw new Error('还没填 API Key');
  const p=AI_PROVIDERS.find(x=>x.k===(c.provider||'qwen'))||AI_PROVIDERS[0];
  const url=(c.endpoint&&c.endpoint.trim())||p.ep;
  const model=(c.model&&c.model.trim())||p.model;
  if(!url||!model)throw new Error('接口地址或模型没填');
  const body={
    model,
    messages:[{role:'user',content:[
      {type:'image_url',image_url:{url:dataUrl}},
      {type:'text',text:OCR_PROMPT}
    ]}],
    temperature:0.1
  };
  const resp=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key.trim()},
    body:JSON.stringify(body)
  });
  if(!resp.ok){
    let t='';try{t=await resp.text()}catch(e){}
    throw new Error('识别失败（'+resp.status+'）'+(t?': '+t.slice(0,160):''));
  }
  const j=await resp.json();
  const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  if(!txt)throw new Error('接口没返回内容');
  return String(txt).replace(/```[a-z]*\n?/gi,'').trim();
}
function readImageFile(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error('不是图片文件'));return}
    if(file.size>6*1024*1024){rej(new Error('图片太大了（超过 6MB），先裁一下或压缩'));return}
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('图片读不出来'));
    r.readAsDataURL(file);
  });
}

/* 把图片压到 size×size（正方形居中裁切）再转 dataURL，避免 localStorage 撑爆 */
function shrinkImage(file,size){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)){rej(new Error('不是图片文件'));return}
    if(file.size>12*1024*1024){rej(new Error('图片太大了（超过 12MB），先压缩一下'));return}
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('图片读不出来'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('这个格式浏览器打不开，换 JPG / PNG 试试'));
      img.onload=()=>{
        try{
          const cv=document.createElement('canvas');cv.width=size;cv.height=size;
          const g=cv.getContext('2d');
          if(!g){rej(new Error('浏览器不支持压缩图片'));return}
          const s=Math.min(img.width,img.height)||1;
          g.drawImage(img,(size-img.width*(size/s))/2,(size-img.height*(size/s))/2,img.width*(size/s),img.height*(size/s));
          res(cv.toDataURL('image/jpeg',0.86));
        }catch(err){rej(err)}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* 日程按天分组：今天 / 明天 / 后天 / 之后每天单独一组（带星期几）/ 已过期 */
function evGroups(){
  const d0=today(),now=new Date();
  const d1=ymd(new Date(now.getTime()+86400000));
  const d2=ymd(new Date(now.getTime()+2*86400000));
  const days=[];
  S.events.forEach(e=>{
    const k=e.date||'';
    if(k&&!days.find(x=>x.d===k))days.push({d:k});
  });
  days.sort((a,b)=>a.d.localeCompare(b.d));
  const later=days.filter(x=>x.d>d2).map(x=>x.d);
  const out=[
    {d:d0,k:'今天'},
    {d:d1,k:'明天'},
    {d:d2,k:'后天'}
  ].map(g=>({...g,list:S.events.filter(e=>e.date===g.d)}));
  // 之后每一天单独一组
  later.forEach(ds=>out.push({d:ds,k:dayLabel(ds),list:S.events.filter(e=>e.date===ds)}));
  // 没有日期的
  const none=S.events.filter(e=>!e.date);
  if(none.length)out.push({d:'',k:'待定日期',list:none});
  // 过期的放最后
  const past=days.filter(x=>x.d&&x.d<d0).map(x=>x.d);
  past.forEach(ds=>out.push({d:ds,k:dayLabel(ds),past:true,list:S.events.filter(e=>e.date===ds)}));
  return out;
}
/* 日期 → 「11月17日 周一」 */
function dayLabel(ds){
  if(!ds)return '';
  const p=ds.split('-');if(p.length<3)return ds;
  const dt=new Date(+p[0],+p[1]-1,+p[2]);
  const LC=curLang();
  const wk=LC==='zh'?['周日','周一','周二','周三','周四','周五','周六']
    :LC==='ja'?['日曜','月曜','火曜','水曜','木曜','金曜','土曜']
    :LC==='ko'?['일','월','화','수','목','금','토']
    :['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const md=LC==='zh'?(+p[1])+'月'+(+p[2])+'日'
    :LC==='ja'?(+p[1])+'月'+(+p[2])+'日'
    :LC==='ko'?(+p[1])+'월 '+(+p[2])+'일'
    :['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+' '+p[2];
  return md+' '+wk[dt.getDay()];
}

const CAT_OUT=['吃饭','交通','学习','购物','娱乐','住宿','人情','其他'];
const CAT_IN=['生活费','兼职','红包','奖学金','其他'];
function thisMonth(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function fmt(n){return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace(/\.00$/,'')}
function billMonth(list,ym){
  let out=0,inn=0;
  list.forEach(b=>{if(String(b.date||'').slice(0,7)!==ym)return;(b.type==='in'?inn+=+b.amt||0:out+=+b.amt||0)});
  return {out,inn};
}
/* 年账单：返回该年每月的收支 + 合计 */
function billYear(list,y){
  const months=[];
  for(let i=1;i<=12;i++){
    const ym=y+'-'+pad(i);
    const r=billMonth(list,ym);
    months.push({ym,m:i,out:r.out,inn:r.inn});
  }
  const total={out:0,inn:0};
  months.forEach(x=>{total.out+=x.out;total.inn+=x.inn});
  return {y,months,total};
}
/* 从某个月往前/往后挪 n 个月 */
function shiftMonth(ym,n){
  const [y,m]=String(ym).split('-').map(Number);
  const d=new Date(y,(m-1)+n,1);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function thisYear(){return new Date().getFullYear()}
/* 该记账数据里最早最晚的月份区间 */
function billRange(list){
  const ys=list.map(b=>String(b.date||'').slice(0,7)).filter(x=>x.length===7).sort();
  return ys.length?{min:ys[0],max:ys[ys.length-1]}:null;
}
/* 导出一段流水为 CSV（Excel / WPS 直接能打开） */
function billCsv(list,title){
  const head=['日期','类型','分类','金额','备注'];
  const rows=list.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)))
    .map(b=>[b.date,b.type==='in'?'收入':'支出',b.cat,(b.type==='in'?'':'-')+fmt(b.amt),b.note||'']);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
  return '\ufeff'+csv;   // BOM，Excel 打开中文不乱码
}
function download(name,content,type){
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}

/* ============ 内嵌导入：读写状态 ============ */
function impState(mode){
  window._impBox=window._impBox||{mode:null,text:'',prev:[],fb:today(),pri:'p1',img:null};
  const b=window._impBox;
  if(b.mode!==mode){b.mode=mode;b.text='';b.prev=[];b.fb=today();b.pri='p1';b.img=null}
  return b;
}
function syncImp(){
  const b=window._impBox;if(!b)return;
  const t=b.mode?document.getElementById('imp_'+b.mode):null;
  if(t)b.text=t.value;
  const fb=b.mode?document.querySelector('[data-impfb="'+b.mode+'"]'):null;
  if(fb)b.fb=fb.value;
  const pr=b.mode?document.querySelector('[data-imppri="'+b.mode+'"]'):null;
  if(pr)b.pri=pr.value;
}
function impParse(mode){
  const b=impState(mode);syncImp();
  const res=parseText(b.text,{fallbackDate:b.fb||today()});
  if(!res.length){toast('没认出内容，一段一行再试试');return}
  res.forEach(x=>{if(!x.pri)x.pri=b.pri||'p1'});
  b.prev=res;save();render(true);
  toast('认出 '+res.length+' 条，确认一下');
}
async function impOcr(mode,btn){
  const b=impState(mode);syncImp();
  if(!b.img){toast('先选一张图片');return}
  if(!aiReady()){toast('还没填 API Key，去「设置 → 图片识别」填一下');S.tab='me';save();render();return}
  const old=btn.textContent;btn.textContent='识别中…';btn.disabled=true;
  try{
    const txt=await aiRecognize(b.img);
    b.text=((b.text||'').trim()?b.text.trim()+'\n':'')+txt;
    const res=parseText(txt,{fallbackDate:b.fb||today()});
    res.forEach(x=>{if(!x.pri)x.pri=b.pri||'p1'});
    b.prev=res;save();render(true);
    toast('图片识出 '+res.length+' 条');
  }catch(err){
    btn.textContent=old;btn.disabled=false;
    toast(String(err.message||err).slice(0,80));
    console.error(err);
  }
}
function impCommit(mode){
  const b=impState(mode);syncImp();
  const list=b.prev||[];
  if(!list.length)return;
  if(mode==='hw'){
    const first=list[0];
    const dl=(first.date||today())+'T'+(first.time||'23:59');
    const id=uid();
    S.hws.push({id,title:first.title||'新作业',course:'未分类',score:'—',deadline:dl,pri:b.pri||'p1',
      note:(b.text||'').trim(),
      deliver:[{t:'作品 / 文件',done:false},{t:'说明文档',done:false}],
      check:[{t:'命名规范核对',done:false},{t:'确认已点「提交」',done:false}]});
    S.curHw=id;
    S.events.push({id:uid(),date:first.date||today(),time:first.time||'',title:'提交：'+(first.title||'新作业'),cat:'作业',pri:b.pri||'p1',done:false});
    b.prev=[];b.text='';b.img=null;save();S.tab='hw';render();toast('作业建好了，去勾清单');return;
  }
  let n=0;
  list.forEach(x=>{
    if(!String(x.title||'').trim())return;
    if(mode==='task')S.tasks.push({id:uid(),t:x.title,cat:'其他',done:false,pri:x.pri||b.pri||'p1',due:x.date||'',ts:Date.now()});
    else S.events.push({id:uid(),title:x.title,date:x.date||today(),time:x.time||'',cat:'其他',done:false,pri:x.pri||b.pri||'p1'});
    n++;
  });
  b.prev=[];b.text='';b.img=null;save();
  toast('导入了 '+n+' 条');
  render(true);
}

/* 静态外壳（侧栏/导航/底部）跟着语言走 */
function applyLang(){
  const L=curLang();
  const def=LANGS.find(x=>x.k===L)||LANGS[0];
  document.documentElement.lang=def.html;
  document.querySelectorAll('#nav .nl').forEach(el=>{el.textContent=t(el.dataset.k)});

  set('offlineTip','离线可用 · 关掉页面数据不丢');
  const sel=document.getElementById('langSel');

    const icon={'zh':'🇨🇳','en':'🇬🇧','ja':'🇯🇵','ko':'🇰🇷','es':'🇪🇸','fr':'🇫🇷'};
    sel.innerHTML=LANGS.map(x=>`<option value="${x.k}" ${x.k===L?'selected':''}>${icon[x.k]||'🌏'} ${x.n}</option>`).join('');

  if(id==='refs'){S.refs=e.target.value;save()}
  if(id==='f_sid'||id==='f_nm'||id==='f_topic'){
    S.name={sid:document.getElementById('f_sid').value,nm:document.getElementById('f_nm').value,topic:document.getElementById('f_topic').value};save();
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='darkT'){P.dark=e.target.checked;saveProf(P);applyTheme(P);toast(P.dark?'深色模式已开':'改回浅色');}
  if(e.target.id==='avFile'){
    const f=e.target.files&&e.target.files[0];e.target.value='';
    if(!f)return;
    if(!/^image\//.test(f.type)){toast('这个不是图片文件');return}
    shrinkImage(f,160).then(url=>{
      P.avatar={k:'img',v:url};saveProf(P);renderUser();render(true);
      toast('头像换好了');
    }).catch(err=>toast(String(err.message||err).slice(0,40)));
  }
});
/* 收支切换时，分类跟着换 */
document.addEventListener('change',e=>{
  if(e.target.id==='billType'){
    const sel=e.target,isIn=sel.value==='in';
    const catSel=sel.closest('form').querySelector('[name=cat]');
    const cats=isIn?CAT_IN:CAT_OUT;
    catSel.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
  }
});
/* 图片：拖进导入框 或 在文本框里 Ctrl+V */
document.addEventListener('paste',async e=>{
  const zone=e.target.closest&&e.target.closest('.imp-drop');if(!zone)return;
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(const it of items){
    if(it.type.indexOf('image')===0){
      e.preventDefault();
      const mode=zone.dataset.drop;
      try{const url=await readImageFile(it.getAsFile());const b=impState(mode);b.img=url;syncImp();save();render(true);toast('图片粘好了，点「识别图片」');}
      catch(err){toast(err.message)}
      return;
    }
  }
});
document.addEventListener('dragover',e=>{
  const z=e.target.closest&&e.target.closest('.imp-drop');if(!z)return;
  e.preventDefault();z.classList.add('dragover');
});
document.addEventListener('dragleave',e=>{
  const z=e.target.closest&&e.target.closest('.imp-drop');if(z)z.classList.remove('dragover');
});
document.addEventListener('drop',async e=>{
  const z=e.target.closest&&e.target.closest('.imp-drop');if(!z)return;
  e.preventDefault();z.classList.remove('dragover');
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;
  const mode=z.dataset.drop;
  try{const url=await readImageFile(f);const b=impState(mode);b.img=url;syncImp();save();render(true);toast('图片放好了，点「识别图片」');}
  catch(err){toast(err.message)}
});
document.getElementById('brand').addEventListener('click',()=>{S.tab='me';save();render()});
function renderUser(){
  const who=(P.user||'小玉').trim()||'小玉';
  const av=document.getElementById('avatar');
  const a=P.avatar;
  av.className='avatar';
  av.innerHTML='';
  if(a&&a.k==='img'&&a.v){av.innerHTML='<img src="'+esc(a.v)+'" alt="">'}
  else if(a&&a.k==='emoji'&&a.v){av.classList.add('emoji');av.textContent=a.v}
  else{av.textContent=who.charAt(0)}
  const zh=curLang()==='zh';
  document.getElementById('userName').textContent=who+(zh?'的工作台':'\'s Workspace');
  document.getElementById('userSub').textContent=accounts().length>1
    ?(zh?('当前：'+who+' · 点这里切换'):('Current: '+who+' · click to switch'))
    :(zh?'点这里换颜色 / 加账户':'Click for colors / accounts');
  applyLang();
}
/* 切换语言：只影响当前账户，立刻重绘 */
function setLang(k){
  P.lang=k;saveProf(P);
  applyLang();renderUser();render(true);
  window.scrollTo({top:0,behavior:'smooth'});
  toast(k==='zh'?'界面语言：中文':('Language: '+(LANGS.find(x=>x.k===k)||{}).n));
}
function mixTheme(hex){
  const h2r=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
  const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
  const base=h2r(hex);
  return {brand:hex,brand2:toHex(mix(base,[255,255,255],0.22)),soft:toHex(mix(base,[255,255,255],0.90)),
    soft2:toHex(mix(base,[255,255,255],0.78)),dark:toHex(mix(base,[0,0,0],0.22)),ring:'rgba('+base.join(',')+',.10)'};
}
document.getElementById('importFile').addEventListener('change',function(){
  const f=this.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.hws)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o);save();render();toast('导入成功')}catch(err){toast('这个文件读不了，换一个备份试试')}};
  r.readAsText(f);this.value='';
});
renderUser();
render();

</script>
